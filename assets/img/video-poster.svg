<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="50%" stop-color="#0f1d38"/>
      <stop offset="100%" stop-color="#080d1a"/>
    </linearGradient>
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0288d1"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bg)"/>

  <!-- Background Code Lines -->
  <g opacity="0.12" font-family="'JetBrains Mono', monospace" font-size="20" fill="#38bdf8">
    <text x="60" y="80">#include &lt;stdio.h&gt;</text>
    <text x="60" y="115">#include &lt;stdlib.h&gt;</text>
    <text x="60" y="150">int main(void) {</text>
    <text x="100" y="185">printf("Try, Catch &amp; Learn - UTFPR\\n");</text>
    <text x="100" y="220">int status = 1;</text>
    <text x="100" y="255">while (status) { learn_c(); }</text>
    <text x="100" y="290">return 0;</text>
    <text x="60" y="325">}</text>
  </g>

  <!-- Glowing Center Ambient -->
  <circle cx="640" cy="340" r="160" fill="#0288d1" opacity="0.12" filter="url(#glow)"/>

  <!-- Titles -->
  <text x="640" y="450" font-family="'Plus Jakarta Sans', sans-serif" font-size="34" font-weight="800" fill="#ffffff" text-anchor="middle">TRY, CATCH &amp; LEARN</text>
  <text x="640" y="490" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="600" fill="#38bdf8" text-anchor="middle" letter-spacing="3">UTFPR CORNÉLIO PROCÓPIO • VÍDEO HD</text>
</svg>
